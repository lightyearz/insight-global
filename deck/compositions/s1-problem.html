      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // ---- ambient background (one slow diagonal drift + glow breathing) ----
          tl.fromTo("#s1-grid", { x: 0, y: 0 }, { x: -48, y: -48, duration: 19, ease: "none" }, 0);
          tl.fromTo("#s1-glow", { scale: 1 }, { scale: 1.07, duration: 4.75, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);

          // ---- 0-1.5s: calendar chip + scenario tag ----

          tl.fromTo("#s1-day-0", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo("#s1-tag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.6);

          // ---- 1.5-3.5s: question bubble pops, question types word by word ----

          tl.fromTo(".s1-qw", { opacity: 0 }, { opacity: 1, duration: 0.08, stagger: 0.13, ease: "none" }, 1.95);
          tl.fromTo("#s1-ex", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 1.75);

          // ---- 3.5-7s: six source cards fly in from all four edges, then drift around the question ----
          var cards = [
            { id: "update", from: { x: 0, y: -620, rotation: -6 }, drift: { x: -26, y: -14 }, t: 3.5 },
            { id: "nlm", from: { x: 620, y: -40, rotation: 6 }, drift: { x: 18, y: 26 }, t: 3.8 },
            { id: "clin", from: { x: -720, y: 0, rotation: -5 }, drift: null, t: 4.1 },
            { id: "rev", from: { x: 120, y: 520, rotation: 5 }, drift: { x: -40, y: 6 }, t: 4.4 },
            { id: "jour", from: { x: 560, y: 60, rotation: 4 }, drift: { x: -8, y: 20 }, t: 4.7 },
            { id: "soc", from: { x: -520, y: 420, rotation: -4 }, drift: null, t: 5.0 }
          ];
          cards.forEach(function (c) {
            tl.fromTo(
              "#s1-c-" + c.id,
              { opacity: 0, x: c.from.x, y: c.from.y, rotation: c.from.rotation },
              { opacity: 1, x: 0, y: 0, rotation: 0, duration: 1.25, ease: "power3.out" },
              c.t
            );
            if (c.drift) {
              tl.fromTo(
                "#s1-slot-" + c.id,
                { x: 0, y: 0 },
                { x: c.drift.x, y: c.drift.y, duration: 18.6 - (c.t + 1.3), ease: "sine.inOut" },
                c.t + 1.3
              );
            }
          });
          // the two guideline cards drift slowly, then drift together and clash (9-12s)
          tl.fromTo("#s1-slot-clin", { x: 0, y: 0 }, { x: 8, y: 10, duration: 3.6, ease: "sine.inOut" }, 5.4);
          tl.fromTo("#s1-slot-soc", { x: 0, y: 0 }, { x: -12, y: -10, duration: 2.7, ease: "sine.inOut" }, 6.3);
          tl.fromTo("#s1-slot-clin", { x: 8, y: 10 }, { immediateRender: false, x: 20, y: 46, duration: 2.0, ease: "power2.inOut" }, 9.1);
          tl.fromTo("#s1-slot-soc", { x: -12, y: -10 }, { immediateRender: false, x: -30, y: -56, duration: 2.0, ease: "power2.inOut" }, 9.1);

          // ---- 7-9s: headline rises, subhead fades in, cards dim to 60% ----
          tl.fromTo("#s1-head", { opacity: 0, y: 46 }, { opacity: 1, y: 0, duration: 0.95, ease: "expo.out" }, 7.0);
          tl.fromTo("#s1-sub", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 7.45);
          tl.fromTo(
            ["#s1-c-update", "#s1-c-nlm", "#s1-c-rev", "#s1-c-jour", "#s1-c-clin", "#s1-c-soc"],
            { opacity: 1 },
            { immediateRender: false, opacity: 0.6, duration: 0.8, ease: "power1.inOut" },
            7.3
          );

          // ---- 9-12s: two guideline sources drift together and clash; a question mark pulses between them ----
          tl.fromTo(["#s1-c-clin", "#s1-c-soc"], { opacity: 0.6 }, { immediateRender: false, opacity: 1, duration: 0.5, ease: "power1.out" }, 9.1);
          tl.fromTo(
            ["#s1-c-clin", "#s1-c-soc"],
            { borderColor: "#d3dde3", backgroundColor: "#fdfefe" },
            { borderColor: "#b83a33", backgroundColor: "#fbe2df", duration: 0.9, ease: "power1.inOut" },
            9.9
          );
          tl.fromTo("#s1-q", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, 10.4);
          tl.fromTo("#s1-q", { scale: 1 }, { immediateRender: false, scale: 1.14, duration: 0.4, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.85);

          // ---- 11.5-14s: the calendar flips toward Friday, a little faster each day ----
          var flips = [
            { from: "#s1-day-0", to: "#s1-day-1", t: 11.6, d: 0.55 },
            { from: "#s1-day-1", to: "#s1-day-2", t: 12.55, d: 0.42 },
            { from: "#s1-day-2", to: "#s1-day-3", t: 13.3, d: 0.32 }
          ];
          flips.forEach(function (f) {
            var out = { immediateRender: false, opacity: 0, rotationX: -80, y: -26, duration: f.d, ease: "power2.in", transformOrigin: "50% 100%" };
            tl.fromTo(f.from, { opacity: 1, rotationX: 0, y: 0 }, out, f.t);
            tl.fromTo(f.to, { opacity: 0, rotationX: 80, y: 26 }, { opacity: 1, rotationX: 0, y: 0, duration: f.d, ease: "power2.out", transformOrigin: "50% 0%" }, f.t + f.d * 0.55);
          });

          // ---- 14-16.5s: three words stamp in along the bottom ----
          ["#s1-w1", "#s1-w2", "#s1-w3"].forEach(function (w, i) {
            tl.fromTo(w, { opacity: 0, scale: 1.3, y: -8 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "power3.out", transformOrigin: "50% 60%" }, 14.0 + i * 0.8);
          });
          tl.fromTo(["#s1-sep1", "#s1-sep2"], { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", stagger: 0.8 }, 14.55);

          // ---- 16.5-18.4s: the supporting cast dims; the headline, the three words and the question stay at full strength ----
          tl.fromTo(
            ["#s1-tag", "#s1-sub", "#s1-cal", ".s1-card"],
            { opacity: 1 },
            { immediateRender: false, opacity: 0.25, duration: 1.1, ease: "power2.inOut" },
            16.6
          );
          tl.fromTo("#s1-q", { opacity: 1 }, { immediateRender: false, opacity: 0, duration: 0.8, ease: "power2.inOut" }, 16.6);
          tl.fromTo(".s1-word", { color: "#13294b" }, { color: "#0e7470", duration: 1.1, ease: "power2.inOut" }, 16.6);
          tl.fromTo("#s1-bubble-glow", { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 1.3, ease: "power2.out" }, 16.7);
          tl.fromTo("#s1-bubble", { scale: 1 }, { immediateRender: false, scale: 1.04, duration: 1.3, ease: "power2.out" }, 16.8);

          // ---- 18.45-18.9s: exit. Everything but the question leaves; the bubble is the match-cut into slide 2 ----
          tl.fromTo("#s1-dim", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power2.in" }, 18.45);

          window.__timelines["s1-problem"] = tl;
        })();
